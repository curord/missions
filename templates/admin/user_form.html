{% extends "base.html" %}

{% block title %}{{ 'Editar Membre' if member else 'Nou Membre' }} · Administració{% endblock %}

{% block content %}

<section class="section">
    <div class="page-title d-flex justify-content-between align-items-center mb-4">
        <h1 class="fw-bold mb-0">{{ '✏️ Editar Membre' if member else '👤 Afegir Nou Membre' }}</h1>
        <a href="{{ url_for('admin.users_list') }}" class="btn btn-outline-secondary rounded-3">
            ⬅️ Cancel·lar
        </a>
    </div>

    <div class="card-ui shadow-sm border-0 p-4" style="border-radius: 20px; max-width: 600px; margin: 0 auto;">
        <form method="POST">
            <div class="mb-3">
                <label for="name" class="form-label fw-bold">Nom del Membre</label>
                <input type="text" class="form-control form-control-lg rounded-3" id="name" name="name" 
                       value="{{ member.name if member else '' }}" placeholder="Ex. Marc, Laura, Pol..." required>
            </div>

            <div class="mb-3">
                <label for="role" class="form-label fw-bold">Rol a la Família</label>
                <select class="form-select form-select-lg rounded-3" id="role" name="role" required>
                    <option value="child" {{ 'selected' if member and member.role == 'child' else '' }}>👦 Gamer (Nen / Nena)</option>
                    <option value="admin" {{ 'selected' if member and member.role == 'admin' else '' }}>👑 Administrador (Pare / Mare / Tutor)</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="avatar" class="form-label fw-bold">Avatar (Emoji)</label>
                <select class="form-select form-select-lg rounded-3" id="avatar" name="avatar">
                    <option value="👦" {{ 'selected' if member and member.avatar == '👦' else '' }}>👦 Nen</option>
                    <option value="👧" {{ 'selected' if member and member.avatar == '👧' else '' }}>👧 Nena</option>
                    <option value="👨" {{ 'selected' if member and member.avatar == '👨' else '' }}>👨 Pare</option>
                    <option value="👩" {{ 'selected' if member and member.avatar == '👩' else '' }}>👩 Mare</option>
                    <option value="🦁" {{ 'selected' if member and member.avatar == '🦁' else '' }}>🦁 Lleó</option>
                    <option value="🦄" {{ 'selected' if member and member.avatar == '🦄' else '' }}>🦄 Unicorn</option>
                    <option value="🚀" {{ 'selected' if member and member.avatar == '🚀' else '' }}>🚀 Coet</option>
                    <option value="👑" {{ 'selected' if member and member.avatar == '👑' else '' }}>👑 Corona</option>
                </select>
            </div>

            <div class="mb-4">
                <label for="favorite_color" class="form-label fw-bold">Color Preferit</label>
                <input type="color" class="form-control form-control-color rounded-3 w-100" id="favorite_color" name="favorite_color" 
                       value="{{ member.favorite_color if member and member.favorite_color else '#3b82f6' }}">
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn-ui btn-primary-ui py-3 fs-5 fw-bold">
                    💾 {{ 'Desar Canvis' if member else 'Crear Membre' }}
                </button>
            </div>
        </form>
    </div>
</section>

{% endblock %}
