<div class="validation-card">

    <div class="validation-header">

        <div class="mission-icon">
            {{ mission.icon or "📖" }}
        </div>

        <div>

            <h3>{{ mission.title }} </h3>
               
            <div class="validation-user">
                👤 {{ mission.gamer_name }}
                
                   <p class="validation-date">

                    🕒 {{ mission.time_ago }}

                    ·

                    {{ mission.completed_date }}

                </p>
            </div>

        </div>

    </div>

    {% if mission.description %}
        <p class="validation-description">
            {{ mission.description }}
        </p>
    {% endif %}

    <div class="validation-footer">

        <span class="validation-points">
            ⭐ {{ mission.points }} XP
        </span>

        <div class="button-group" style="display: flex; gap: 8px; width: 100%;">

            <form method="POST"
                  action="{{ url_for('missions.approve', assignment_id=mission.assignment_id) }}"
                  style="flex: 1; min-width: 0;">

                <button class="btn-ui btn-success-ui w-100 text-center px-1" style="font-size: 0.9rem; white-space: nowrap; text-overflow: ellipsis; overflow: hidden;">
                    ✅ Aprovar
                </button>

            </form>

            <form method="POST"
                  action="{{ url_for('missions.reject', assignment_id=mission.assignment_id) }}"
                  onsubmit="const r = prompt('Motiu de la devolució:'); if (!r) return false; this.reason.value = r;"
                  style="flex: 1; min-width: 0;">
                <input type="hidden" name="reason">
                <button class="btn-ui btn-danger-ui w-100 text-center px-1" style="font-size: 0.9rem; white-space: nowrap; text-overflow: ellipsis; overflow: hidden;">
                    ❌ Retornar
                </button>
            </form>


        </div>

    </div>

</div>
