<div class="mission-card category-{{ mission.category|lower|replace(' ','-') }}">

    <div class="mission-top">

        <div class="mission-icon">
            {{ mission.icon or "📖" }}
        </div>

        <div class="mission-info">

            <h3>{{ mission.title }}</h3>

            <p><strong>{{ mission.gamer_name }}</strong></p>

            {% if mission.description %}
                <p>{{ mission.description }}</p>
            {% endif %}

        </div>

    </div>

    <div class="mission-meta">
        <span>⭐ {{ mission.points }} XP</span>
    </div>

    <div class="button-group" style="display: flex; gap: 8px; width: 100%;">

        <form method="POST"
              action="{{ url_for('admin.approve', assignment_id=mission.assignment_id) }}"
              style="flex: 1; min-width: 0;">

            <button class="btn-ui btn-success-ui w-100 text-center px-1" style="font-size: 0.9rem; white-space: nowrap; text-overflow: ellipsis; overflow: hidden;">
                ✅ Aprovar
            </button>

        </form>

        <form method="POST"
              action="{{ url_for('admin.reject', assignment_id=mission.assignment_id) }}"
              onsubmit="const r = prompt('Motiu de la devolució:'); if (!r) return false; this.reason.value = r;"
              style="flex: 1; min-width: 0;">
            <input type="hidden" name="reason">
            <button class="btn-ui btn-danger-ui w-100 text-center px-1" style="font-size: 0.9rem; white-space: nowrap; text-overflow: ellipsis; overflow: hidden;">
                ❌ Rebutjar
            </button>
        </form>

    </div>

</div>
